name: veripack

services:
  postgres:
    image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: veripack
      POSTGRES_PASSWORD: veripack
      POSTGRES_DB: veripack
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veripack -d veripack"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # MinIO no longer publishes community images. S3Mock implements enough of the
  # S3 API for local development; production uses real S3 or the team's MinIO.
  s3mock:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/s3mockroot
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=veripack-tarballs
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9191:9191"
    volumes:
      - s3mockdata:/s3mockroot
    restart: unless-stopped

  verdaccio:
    image: verdaccio/verdaccio@sha256:5623458a61100ff2c89526752e8ea2db58ae2d494fa202c18bf4a508ec46892c
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - ./verdaccio/htpasswd:/verdaccio/conf/htpasswd:ro
      - verdaccio_storage:/verdaccio/storage
    restart: unless-stopped

volumes:
  pgdata:
  s3mockdata:
  verdaccio_storage:
